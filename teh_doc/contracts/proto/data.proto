syntax = "proto3";

package tensa.data;

import "common.proto";

service DataService {

  // Заметки

  rpc GetNotes(GetNotesRequest) returns (GetNotesResponse);

  rpc GetNote(GetNoteRequest) returns (Note);

  // Контакты

  rpc GetContacts(GetContactsRequest) returns (GetContactsResponse);

  rpc GetContact(GetContactRequest) returns (Contact);

  // Поиск по файлам

  rpc SearchFiles(SearchFilesRequest) returns (stream SearchResult);

  // Очередь одобрений

  rpc GetApprovalQueue(GetApprovalQueueRequest) returns (GetApprovalQueueResponse);

}

message GetNotesRequest {

  string node_id = 1;

  uint32 limit = 2;

  uint32 offset = 3;

}

message GetNotesResponse {

  repeated Note notes = 1;

  uint32 total = 2;

}

message GetNoteRequest {

  string note_id = 1;

}

message Note {

  string note_id = 1;

  string title = 2;

  string body = 3;

  repeated string tags = 4;

  int64 created_at = 5;

  int64 updated_at = 6;

}

message GetContactsRequest {

  string node_id = 1;

  uint32 limit = 2;

  uint32 offset = 3;

}

message GetContactsResponse {

  repeated Contact contacts = 1;

  uint32 total = 2;

}

message GetContactRequest {

  string contact_id = 1;

}

message Contact {

  string contact_id = 1;

  string name = 2;

  optional string email = 3;

  optional string phone = 4;

  optional string telegram = 5;

  optional string whatsapp = 6;

}

message SearchFilesRequest {

  string node_id = 1;

  string query = 2;

  uint32 limit = 3;

}

message SearchResult {

  string document_id = 1;

  string source_path = 2;

  string chunk_text = 3;

  float score = 4;

  int64 indexed_at = 5;

}

message GetApprovalQueueRequest {

  string node_id = 1;

}

message GetApprovalQueueResponse {

  repeated ApprovalAction actions = 1;

}

message ApprovalAction {

  string action_id = 1;

  tensa.common.ActionKind kind = 2;

  string payload = 3;  // JSON

  tensa.common.ActionStatus status = 4;

  int64 created_at = 5;

  int64 expires_at = 6;

}
