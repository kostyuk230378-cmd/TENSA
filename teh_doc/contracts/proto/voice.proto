syntax = "proto3";

package tensa.voice;

service VoiceService {

  // Распознавание речи

  rpc Transcribe(stream AudioChunk) returns (TranscribeResponse);

  rpc TranscribeFile(TranscribeFileRequest) returns (TranscribeResponse);

  // VAD

  rpc DetectVoiceActivity(stream AudioChunk) returns (stream VadResult);

}

message AudioChunk {

  bytes data = 1;

  uint32 sample_rate = 2;

  uint32 channels = 3;

  string format = 4;  // pcm, opus, mp3

}

message TranscribeResponse {

  string text = 1;

  string language = 2;

  float confidence = 3;

  repeated Segment segments = 4;

}

message Segment {

  string text = 1;

  float start = 2;

  float end = 3;

  float confidence = 4;

}

message TranscribeFileRequest {

  string node_id = 1;

  bytes audio_data = 2;

  string format = 3;

  string language = 4;

}

message VadResult {

  bool speech_detected = 1;

  float start = 2;

  float end = 3;

}
