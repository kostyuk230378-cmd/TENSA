[workspace]
resolver = "2"
# [derived] По руководству members перечисляет 21 крейт, но существуют пока только
# реализованные; остальные добавляются по мере появления своих ТЗ.
members = [
    "crates/tensa-approval",
    "crates/tensa-sync",
    "crates/tensa-core",
    "crates/tensa-memory",
    "crates/tensa-nodes",
    "crates/tensa-perf",
    "crates/tensa-router",
    "crates/tensa-server",
    "crates/tensa-tools",
    "crates/tensa-cli",
    "crates/tensa-llm",
    "crates/tensa-llm/llama-sys",
    "crates/tensa-llm/llama",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
authors = ["Tensa Contributors"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/tensorlogix/tensa"
homepage = "https://tensa.tensorlogix.com"
documentation = "https://docs.tensa.tensorlogix.com"

[workspace.dependencies]
# Асинхронность
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
futures = "0.3"
tokio-stream = { version = "0.1", features = ["sync"] }

# Сериализация
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# БД
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "uuid"] }

# gRPC
tonic = "0.12"
prost = "0.13"
tonic-build = "0.12"

# HTTP
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# HTTP-сервер PWA (Контракт 12; tensa-server)
axum = "0.7"
tower-http = { version = "0.6", features = ["fs"] }
tower = { version = "0.5", features = ["util"] }

# CLI (tensa-cli)
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
colored = "3.1"
indicatif = "0.18"
comfy-table = "7.2"

# Утилиты
uuid = { version = "1.6", features = ["v4", "serde"] }
rand = "0.9"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
notify = "6.1"
sha2 = "0.10"
lru = "0.12"
semver = "1.0"
# Векторный поиск / эмбеддинги (для tensa-memory)
# Версии обновлены (апрув Архитектора 2026-10-15): lance 0.9/fastembed 4.0
# не компилируются rustc 1.98 (arrow-arith 50: quarter() vs chrono).
# API lance 13.0 / fastembed 7.1 проверен: crates/tensa-memory/tests/api_surface.rs.
lance = "13.0"
fastembed = "7.1"
# Профилирование устройства (tensa-perf, ТЗ tensa-perf).
sysinfo = "0.39"
# Windows API: батарея (GetSystemPowerStatus); используется под cfg(windows).
windows-sys = { version = "0.61", features = ["Win32_System_Power"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true

[profile.test]
opt-level = 1

[profile.bench]
opt-level = 3
lto = "thin"
