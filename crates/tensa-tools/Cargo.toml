[package]
name = "tensa-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Мета-крейт инструментов секретаря (ТЗ tensa-tools): Tool + ToolRegistry, первые подкрейты (wol, apps, documents и др. — по плану)"

[dependencies]
# Внутренние
tensa-core = { path = "../tensa-core" }
tensa-approval = { path = "../tensa-approval" }

# Внешние (из workspace)
tokio.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
uuid.workspace = true
# Telegram Bot API / будущие сетевые инструменты (ТЗ tensa-tools).
reqwest.workspace = true
# Почта (Контракт 6): SMTP-транспорт lettre (rustls) + разбор TOML-аккаунтов.
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "tokio1", "tokio1-rustls-tls", "builder", "hostname"] }
toml.workspace = true
calamine = "0.36"
# IMAP (Контракт 6, апрув Архитектора 09.11.2026): протокол без TLS-фичи —
# транспорт (rustls или mock-TCP в тестах) оборачивает поток снаружи.
async-imap = { version = "0.10", default-features = false, features = ["runtime-tokio"] }
tokio-rustls.workspace = true
rustls.workspace = true
webpki-roots.workspace = true
futures.workspace = true
pdf-extract = "0.12"
zip = "9"
quick-xml = "0.42"

[features]
default = []
