<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tensa</title>
    <style>
      /* Шрифты брендбука — вкомплектованы (woff2, кириллица + латиница). */
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/static/fonts/inter-cyrillic-wght-normal.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "Inter";
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url("/static/fonts/inter-latin-wght-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url("/static/fonts/jetbrains-mono-cyrillic-wght-normal.woff2") format("woff2");
        unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;
      }
      @font-face {
        font-family: "JetBrains Mono";
        font-style: normal;
        font-weight: 100 800;
        font-display: swap;
        src: url("/static/fonts/jetbrains-mono-latin-wght-normal.woff2") format("woff2");
        unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA,
          U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193,
          U+2212, U+2215, U+FEFF, U+FFFD;
      }

      /* Палитра TLX: Success Green для Tensa, циан для акцентов, тёмное HUD-стекло. */
      :root {
        --bg: #09090b;
        --surface: #121215;
        --grid: #27272a;
        --cyan: #00f0ff;
        --green: #00ff00;
        --green-deep: #00d000;
        --red: #ff0055;
        --yellow: #ffb800;
        --text: #ffffff;
        --text2: #a1a1aa;
        --muted: #52525b;
        --border: rgba(255, 255, 255, 0.1);
        --glass: rgba(18, 18, 21, 0.97);
        --ui: "Inter", "Manrope", "Segoe UI", system-ui, sans-serif;
        --mono: "JetBrains Mono", "Fira Code", Consolas, monospace;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
        font-family: var(--ui);
        color: var(--text);
        user-select: none;
        cursor: default;
      }

      .stage { position: relative; width: 100vw; height: 100vh; }

      /* Док: пилюля и лампочка над ней — один перетаскиваемый блок. */
      .dock {
        position: absolute;
        left: 50%;
        bottom: 6px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        gap: 3px;
        width: max-content;
      }

      /* Лампочка уведомлений — над пилюлей, справа, чуть выше. */
      .bulb {
        width: 42px;
        height: 42px;
        margin-right: 8px;
        border-radius: 50%;
        border: 1px solid var(--border);
        background: var(--glass);
        box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.55);
        display: grid;
        place-items: center;
        cursor: grab;
        z-index: 5;
      }

      .bulb svg { width: 18px; height: 18px; }

      .badge {
        position: absolute;
        top: -3px;
        right: -3px;
        min-width: 17px;
        height: 17px;
        padding: 0 4px;
        border-radius: 9px;
        background: var(--red);
        color: #fff;
        font-family: var(--mono);
        font-size: 10px;
        line-height: 17px;
        text-align: center;
        box-shadow: 0 0 12px rgba(255, 0, 85, 0.6);
      }

      /* Пилюля ровно на три круга, круги вплотную. */
      .pill {
        height: 49px;
        width: max-content;
        border-radius: 25px;
        background:
          radial-gradient(120% 160% at 18% 0%, rgba(255, 255, 255, 0.45), transparent 45%),
          linear-gradient(150deg, #00ff00 0%, #00f000 60%, #00d000 100%);
        box-shadow:
          0 0 0 1px rgba(0, 255, 0, 0.5),
          0 0 26px rgba(0, 255, 0, 0.45),
          0 14px 34px rgba(0, 0, 0, 0.5),
          inset 0 1px 0 rgba(255, 255, 255, 0.5);
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 5px 6px;
        cursor: grab;
      }

      .zone {
        width: 39px;
        height: 39px;
        border-radius: 50%;
        border: 1.5px solid rgba(0, 60, 20, 0.32);
        background: rgba(255, 255, 255, 0.14);
        display: grid;
        place-items: center;
        cursor: pointer;
        transition: background 0.15s ease, box-shadow 0.15s ease;
      }

      .zone:hover {
        background: rgba(255, 255, 255, 0.28);
        box-shadow: 0 0 16px rgba(0, 240, 255, 0.35);
      }

      .zone.recording {
        background: rgba(255, 0, 85, 0.35);
        box-shadow: 0 0 22px rgba(255, 0, 85, 0.65);
      }

      .zone svg { width: 16px; height: 16px; }

      .letter {
        font-family: var(--ui);
        font-size: 21px;
        font-weight: 700;
        letter-spacing: -0.5px;
        line-height: 1;
        color: #062b12;
      }

      /* Развёрнутая панель: тёмное HUD-стекло. */
      .panel {
        position: absolute;
        inset: 0;
        border-radius: 20px;
        background: var(--glass);
        border: 1px solid var(--border);
        box-shadow:
          0 0 0 1px rgba(0, 0, 0, 0.4),
          0 0 34px rgba(0, 240, 255, 0.18),
          0 24px 60px rgba(0, 0, 0, 0.65);
        display: none;
        flex-direction: column;
        padding: 12px;
        overflow: hidden;
      }

      .panel::before {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        border-radius: inherit;
        background-image:
          linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
        background-size: 24px 24px;
        opacity: 0.9;
      }

      .panel > * { position: relative; }

      .expanded .panel { display: flex; }
      .expanded .dock { display: none; }

      .panel-head {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 2px 2px 10px;
        border-bottom: 1px solid var(--border);
        cursor: grab;
      }

      .panel-head:active { cursor: grabbing; }

      .panel-title { font-weight: 600; font-size: 16px; letter-spacing: 0.2px; flex: 1; }
      .mono { font-family: var(--mono); }

      .icon-btn {
        width: 34px;
        height: 34px;
        border-radius: 10px;
        border: 1px solid var(--border);
        background: rgba(255, 255, 255, 0.03);
        display: grid;
        place-items: center;
        cursor: pointer;
        font-size: 16px;
        color: var(--text2);
      }

      .icon-btn:hover {
        color: var(--cyan);
        border-color: rgba(0, 240, 255, 0.5);
        box-shadow: 0 0 14px rgba(0, 240, 255, 0.25);
      }

      .content {
        flex: 1;
        overflow-y: auto;
        padding: 10px 2px 8px;
        scrollbar-width: thin;
        scrollbar-color: var(--grid) transparent;
      }

      .bubble {
        background: rgba(18, 18, 21, 0.75);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        margin: 0 0 8px;
        font-size: 14px;
        line-height: 1.5;
        white-space: pre-wrap;
        word-break: break-word;
        color: var(--text);
      }

      .bubble.user { border-color: rgba(0, 240, 255, 0.35); box-shadow: inset 3px 0 0 var(--cyan); }
      .bubble.error { border-color: rgba(255, 0, 85, 0.45); color: #ffd7e3; }

      .bubble .meta {
        display: block;
        margin-top: 6px;
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
      }

      .file {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
        margin: 6px 0;
        font-size: 13px;
      }

      .file-name {
        border: 0;
        background: none;
        padding: 0;
        text-align: left;
        font: inherit;
        color: var(--cyan);
        text-decoration: underline;
        text-underline-offset: 2px;
        cursor: pointer;
        overflow: hidden;
        text-overflow: ellipsis;
      }

      .file-actions { display: flex; gap: 6px; }

      .mini-btn {
        border: 1px solid rgba(0, 240, 255, 0.4);
        background: transparent;
        border-radius: 8px;
        padding: 4px 8px;
        font-size: 12px;
        cursor: pointer;
        color: var(--cyan);
        text-decoration: none;
      }

      .mini-btn:hover { box-shadow: 0 0 12px rgba(0, 240, 255, 0.35); }
      .mini-btn.ok { color: var(--green); border-color: rgba(0, 255, 0, 0.5); }
      .mini-btn.no { color: var(--red); border-color: rgba(255, 0, 85, 0.5); }

      .composer { display: flex; gap: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

      .composer input {
        flex: 1;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px;
        font-size: 14px;
        font-family: var(--ui);
        background: rgba(9, 9, 11, 0.9);
        color: var(--text);
        outline: none;
      }

      .composer input:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.35), 0 0 18px rgba(0, 240, 255, 0.18);
      }

      .composer .composer-mic {
        display: grid;
        place-items: center;
        background: rgba(0, 240, 255, 0.08);
        color: var(--cyan);
        box-shadow: 0 0 12px rgba(0, 240, 255, 0.2);
      }

      .composer .composer-mic svg { width: 20px; height: 20px; }

      .version-line {
        color: var(--text2);
        font-size: 12px;
        line-height: 1.2;
        padding: 0 2px 8px;
      }

      .mic-card,
      .models-card {
        padding: 12px;
        white-space: normal;
      }

      .card-title {
        font-weight: 600;
        font-size: 14px;
        margin-bottom: 6px;
      }

      .mic-actions {
        display: flex;
        gap: 8px;
        flex-wrap: nowrap;
        margin-top: 2px;
      }

      .mic-actions .mini-btn {
        white-space: nowrap;
        flex: 0 0 auto;
      }

      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
      }

      .form-input {
        width: 100%;
        margin: 4px 0;
        padding: 8px 9px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #09090b;
        color: var(--text);
        font-family: var(--ui);
        font-size: 12px;
        outline: none;
      }

      .form-input:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.3);
      }

      .account-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        border-bottom: 1px solid var(--border);
        padding: 6px 0;
        font-size: 12px;
      }

      .account-row:last-child { border-bottom: 0; }

      .account-mail {
        color: var(--text2);
        font-family: var(--mono);
        font-size: 11px;
      }

      .form-note {
        color: var(--muted);
        font-size: 11px;
        line-height: 1.35;
        margin: 6px 0;
      }

      .brain-option {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(9, 9, 11, 0.55);
        padding: 10px;
        margin-top: 8px;
      }

      .brain-option .model-name { font-size: 14px; }

      .brain-key {
        width: 100%;
        margin: 7px 0;
        padding: 8px 9px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #09090b;
        color: var(--text);
        font-family: var(--mono);
        font-size: 12px;
        outline: none;
      }

      .brain-key:focus {
        border-color: var(--cyan);
        box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.3);
      }

      .brain-actions {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 6px;
      }

      .model-card {
        border: 1px solid var(--border);
        border-radius: 12px;
        background: rgba(9, 9, 11, 0.55);
        padding: 10px;
        margin: 8px 0;
      }

      .model-head {
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .model-name {
        flex: 1;
        font-weight: 600;
        font-size: 14px;
      }

      .model-badge {
        font-family: var(--mono);
        font-size: 10px;
        border: 1px solid rgba(0, 255, 0, 0.45);
        color: var(--green);
        padding: 2px 6px;
        border-radius: 999px;
        white-space: nowrap;
      }

      .model-badge.loaded {
        border-color: rgba(0, 240, 255, 0.35);
        color: var(--cyan);
      }

      .model-desc {
        color: var(--text2);
        font-size: 12px;
        line-height: 1.35;
        margin: 6px 0;
      }

      #brain-status {
        color: #fff;
      }

      .model-meta {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        color: var(--muted);
        font-family: var(--mono);
        font-size: 11px;
      }

      .bar {
        display: inline-block;
        width: 42px;
        height: 5px;
        border-radius: 3px;
        background: var(--grid);
        overflow: hidden;
        vertical-align: middle;
      }

      .bar i {
        display: block;
        height: 100%;
        background: var(--cyan);
      }

      .model-actions {
        margin-top: 8px;
      }

      .model-error {
        color: var(--red);
        font-size: 11px;
        margin-top: 6px;
      }

      .progress {
        height: 5px;
        border-radius: 3px;
        background: var(--grid);
        overflow: hidden;
        margin-top: 8px;
      }

      .progress i {
        display: block;
        height: 100%;
        background: var(--green);
      }

      .mic-select {
        width: 100%;
        margin: 8px 0 6px;
        padding: 9px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #09090b;
        color: var(--text);
        font-family: var(--ui);
        font-size: 13px;
      }

      .mic-status {
        margin: 4px 0 8px;
        font-size: 12px;
        color: var(--text2);
        line-height: 1.4;
      }

      .composer .composer-mic.recording {
        background: rgba(255, 0, 85, 0.35);
        border-color: rgba(255, 0, 85, 0.8);
        color: #fff;
        box-shadow: 0 0 18px rgba(255, 0, 85, 0.6);
      }

      .composer button {
        width: 44px;
        height: 44px;
        border-radius: 10px;
        border: 1px solid rgba(0, 240, 255, 0.6);
        background: var(--cyan);
        color: #041014;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 0 18px rgba(0, 240, 255, 0.4);
      }

      .menu {
        position: absolute;
        right: 10px;
        bottom: 102px;
        background: var(--glass);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 6px;
        display: none;
        flex-direction: column;
        min-width: 190px;
        box-shadow: 0 18px 50px rgba(0, 0, 0, 0.6), 0 0 24px rgba(0, 240, 255, 0.12);
        z-index: 10;
      }

      .menu.open { display: flex; }

      .menu button {
        border: 0;
        background: transparent;
        color: var(--text2);
        text-align: left;
        padding: 10px 12px;
        font-size: 14px;
        border-radius: 8px;
        cursor: pointer;
      }

      .menu button:hover { background: rgba(0, 240, 255, 0.1); color: var(--cyan); }
      .menu button.danger:hover { background: rgba(255, 0, 85, 0.12); color: var(--red); }

      .muted { color: var(--muted); font-size: 12px; }
      .status { font-family: var(--mono); font-size: 11px; letter-spacing: 0.5px; }
      .status.pending { color: var(--yellow); }
      .status.approved { color: var(--green); }
      .status.rejected { color: var(--red); }
    </style>
  </head>
  <body>
    <div class="stage" id="stage">
      <div class="dock" id="dock">
        <button class="bulb" id="bulb" title="Уведомления и одобрения" aria-label="Уведомления">
          <svg viewBox="0 0 24 24" fill="none" stroke="#ffb800" stroke-width="1.8">
            <path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.8 10.6c.6.5.8 1.1.8 2.1h6c0-1 .2-1.6.8-2.1A6 6 0 0 0 12 3z" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="badge" id="badge" hidden>0</span>
        </button>

        <div class="pill" id="pill" title="Tensa — потяни, чтобы переместить">
          <button class="zone" id="mic" title="Голосовой ввод" aria-label="Микрофон">
            <svg viewBox="0 0 24 24" fill="none" stroke="#062b12" stroke-width="1.8">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="zone" id="letter" title="Открыть Tensa" aria-label="T">
            <span class="letter">T</span>
          </button>
          <button class="zone" id="dots" title="Меню" aria-label="Меню">
            <svg viewBox="0 0 24 24" fill="none" stroke="#062b12" stroke-width="1.8">
              <circle cx="6" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="18" cy="12" r="1.4"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="menu" id="menu">
        <button data-view="approvals">Одобрения</button>
        <button data-view="settings">Настройки</button>
        <button data-view="chat">Чат</button>
        <button id="collapse">Свернуть</button>
        <button id="quit" class="danger">Выход</button>
      </div>

      <div class="panel" id="panel">
        <div class="panel-head">
          <button class="icon-btn" id="back" title="Свернуть">←</button>
          <div class="panel-title"><span id="panel-title">Tensa</span></div>
          <button class="icon-btn" id="gear" title="Настройки">⚙</button>
        </div>
        <div class="content" id="content"></div>
        <div class="composer" id="composer">
          <input id="input" placeholder="Спросите Tensa…" autocomplete="off" />
          <button id="composer-mic" class="composer-mic" title="Голосовой ввод" aria-label="Микрофон">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
              <rect x="9" y="3" width="6" height="11" rx="3" />
              <path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8" stroke-linecap="round"/>
            </svg>
          </button>
          <button id="send" title="Отправить">➤</button>
        </div>
      </div>
    </div>

    <script>
      const sendIpc = (message) => {
        if (window.ipc && window.ipc.postMessage) window.ipc.postMessage(message);
      };

      const stage = document.getElementById('stage');
      const content = document.getElementById('content');
      const composer = document.getElementById('composer');
      const input = document.getElementById('input');
      const badge = document.getElementById('badge');
      const menu = document.getElementById('menu');
      const title = document.getElementById('panel-title');

      let view = 'chat';
      let expanded = false;
      let messages = [];

      function setExpanded(next) {
        expanded = next;
        stage.classList.toggle('expanded', next);
        sendIpc(next ? 'expand' : 'collapse');
        if (next) { render(); setTimeout(() => input.focus(), 120); }
      }

      function extractFilePaths(text) {
        const pattern = /[A-Za-z]:\\[^\r\n*`]+?\.(?:pdf|docx|doc|xlsx|pptx|txt|md|rtf|odt)/gi;
        const paths = text.match(pattern) || [];
        return [...new Set(paths.map((path) => path.trim().replace(/[.,;:]+$/, '')))];
      }

      function appendPathRow(path) {
        const name = path.split(/[\\/]/).pop() || path;
        const row = document.createElement('div');
        row.className = 'file';
        const label = document.createElement('button');
        label.className = 'file-name';
        label.textContent = name;
        label.title = path;
        label.onclick = () => openFile({ path, name });
        const actions = document.createElement('div');
        actions.className = 'file-actions';
        const download = document.createElement('a');
        download.className = 'mini-btn';
        download.textContent = 'Скачать';
        download.href = `/api/v1/files/download?path=${encodeURIComponent(path)}`;
        download.download = name;
        actions.appendChild(download);
        row.append(label, actions);
        content.appendChild(row);
      }

      function humanVoiceError(message) {
        let text = String(message ?? '');
        try {
          const parsed = JSON.parse(text);
          if (parsed && parsed.error) text = parsed.error;
        } catch (error) {
          /* не JSON */
        }
        text = text.replace(/^unavailable:\s*/i, '').replace(/^голос:\s*/i, '').trim();
        return text || 'не удалось распознать речь';
      }

      function renderChat() {
        title.textContent = 'Tensa';
        composer.style.display = 'flex';
        content.innerHTML = '';
        for (const message of messages) {
          const bubble = document.createElement('div');
          bubble.className = `bubble ${message.role}`;
          bubble.textContent = message.text;
          if (message.meta) {
            const meta = document.createElement('span');
            meta.className = 'meta';
            meta.textContent = message.meta;
            bubble.appendChild(meta);
          }
          content.appendChild(bubble);
          if (!(message.files && message.files.length)) {
            for (const path of extractFilePaths(message.text)) {
              appendPathRow(path);
            }
          }
          const seenFiles = new Set();
          for (const file of message.files || []) {
            const key = file.path.toLowerCase();
            if (seenFiles.has(key)) continue;
            seenFiles.add(key);
            const row = document.createElement('div');
            row.className = 'file';
            const name = document.createElement('button');
            name.className = 'file-name';
            name.textContent = file.name;
            name.title = file.path;
            name.onclick = () => openFile(file);
            const actions = document.createElement('div');
            actions.className = 'file-actions';
            const download = document.createElement('a');
            download.className = 'mini-btn';
            download.textContent = 'Скачать';
            download.href = `/api/v1/files/download?path=${encodeURIComponent(file.path)}`;
            download.download = file.name;
            actions.appendChild(download);
            row.append(name, actions);
            content.appendChild(row);
          }
        }
        if (!messages.length) {
          const hint = document.createElement('div');
          hint.className = 'bubble';
          hint.textContent = 'Спросите Tensa: найду файлы на дисках, отправлю письмо, покажу одобрения.';
          content.appendChild(hint);
        }
        content.scrollTop = content.scrollHeight;
      }

      const MIC_KEY = 'tensa.mic';

      function micConstraints(deviceId) {
        const base = { echoCancellation: true, noiseSuppression: true, autoGainControl: true };
        const saved = deviceId || localStorage.getItem(MIC_KEY) || '';
        return saved ? { ...base, deviceId: { exact: saved } } : base;
      }

      // Если пользователь ничего не выбирал — используется системный микрофон.
      function selectedMicId() {
        return localStorage.getItem(MIC_KEY) || '';
      }

      async function audioInputs() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.enumerateDevices) return [];
        try {
          const devices = await navigator.mediaDevices.enumerateDevices();
          return devices.filter((device) => device.kind === 'audioinput');
        } catch (error) {
          return [];
        }
      }

      async function ensureMicPermission() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return false;
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          stream.getTracks().forEach((track) => track.stop());
          return true;
        } catch (error) {
          return false;
        }
      }

      async function activeMicDeviceId() {
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return '';
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          const track = stream.getAudioTracks()[0];
          const settings = track ? track.getSettings() : {};
          stream.getTracks().forEach((item) => item.stop());
          return settings.deviceId || '';
        } catch (error) {
          return '';
        }
      }

      async function testMicrophone() {
        const status = document.getElementById('mic-status');
        if (!status) return;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          status.textContent = 'Микрофон недоступен в этом движке.';
          return;
        }
        status.textContent = 'Говорите 3 секунды…';
        try {
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: micConstraints(selectedMicId()) });
          } catch (error) {
            if (!localStorage.getItem(MIC_KEY)) throw error;
            localStorage.removeItem(MIC_KEY);
            stream = await navigator.mediaDevices.getUserMedia({ audio: micConstraints() });
          }
          const context = new AudioContext();
          await context.resume();
          const source = context.createMediaStreamSource(stream);
          const analyser = context.createAnalyser();
          analyser.fftSize = 512;
          source.connect(analyser);
          const data = new Uint8Array(analyser.fftSize);
          let peak = 0;
          const timer = setInterval(() => {
            analyser.getByteTimeDomainData(data);
            let sum = 0;
            for (let index = 0; index < data.length; index += 1) {
              const value = (data[index] - 128) / 128;
              sum += value * value;
            }
            peak = Math.max(peak, Math.sqrt(sum / data.length));
            status.textContent = `Уровень: ${Math.round(peak * 100)}%`;
          }, 100);
          setTimeout(() => {
            clearInterval(timer);
            stream.getTracks().forEach((track) => track.stop());
            context.close();
            status.textContent =
              peak > 0.003
                ? `Микрофон слышит (уровень ${Math.round(peak * 100)}%).`
                : 'Тишина — выберите другой микрофон или проверьте доступ в Windows.';
          }, 3000);
        } catch (error) {
          status.textContent = `Ошибка микрофона: ${error.message}`;
        }
      }

      async function autoPickMicrophone() {
        const status = document.getElementById('mic-status');
        const select = document.getElementById('mic-select');
        if (!status || !select) return;
        const devices = (await audioInputs()).filter(
          (device) => device.deviceId && device.deviceId !== 'default',
        );
        if (!devices.length) {
          status.textContent = 'Микрофоны не найдены.';
          return;
        }
        status.textContent = 'Говорите — проверяю микрофоны по очереди…';
        const results = [];
        for (const device of devices) {
          try {
            const stream = await navigator.mediaDevices.getUserMedia({
              audio: { deviceId: { exact: device.deviceId }, echoCancellation: true, noiseSuppression: true, autoGainControl: true },
            });
            const context = new AudioContext();
            await context.resume();
            const source = context.createMediaStreamSource(stream);
            const analyser = context.createAnalyser();
            analyser.fftSize = 512;
            source.connect(analyser);
            const data = new Uint8Array(analyser.fftSize);
            let peak = 0;
            const timer = setInterval(() => {
              analyser.getByteTimeDomainData(data);
              let sum = 0;
              for (let index = 0; index < data.length; index += 1) {
                const value = (data[index] - 128) / 128;
                sum += value * value;
              }
              peak = Math.max(peak, Math.sqrt(sum / data.length));
            }, 50);
            await new Promise((resolve) => setTimeout(resolve, 1200));
            clearInterval(timer);
            stream.getTracks().forEach((track) => track.stop());
            await context.close();
            results.push({ device, peak });
          } catch (error) {
            results.push({ device, peak: 0 });
          }
        }
        results.sort((a, b) => b.peak - a.peak);
        const best = results[0];
        if (best && best.peak > 0.003) {
          localStorage.setItem(MIC_KEY, best.device.deviceId);
          select.value = best.device.deviceId;
          status.textContent = `Выбран: ${best.device.label || 'микрофон'} (уровень ${Math.round(best.peak * 100)}%).`;
        } else {
          status.textContent = 'Речь не слышна. Проверьте доступ к микрофону в Windows и повторите.';
        }
      }

      let speechTimer = null;

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (character) => {
          const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' };
          return map[character];
        });
      }

      function speechBars(value) {
        const width = Math.max(0, Math.min(5, Number(value) || 0)) * 20;
        return `<span class="bar"><i style="width:${width}%"></i></span>`;
      }

        const box = document.getElementById('speech-models');
        if (!box) return;
        box.innerHTML = models
          .map((model) => {
            const badge = model.active
              ? '<span class="model-badge">Активна</span>'
              : model.installed
                ? '<span class="model-badge loaded">Загружена</span>'
                : '';
            let action = '';
            if (model.downloading) {
              action = `<div class="progress"><i style="width:${model.progress}%"></i></div>
                <div class="model-meta">Скачивается… ${model.progress}%</div>`;
            } else if (model.active) {
              action = '<div class="model-meta">Используется сейчас</div>';
            } else if (model.installed && model.can_activate) {
              action = `<button class="mini-btn" data-activate="${model.id}">Выбрать</button>`;
            } else {
              action = `<button class="mini-btn" data-download="${model.id}">Скачать ${model.size_mb} МБ</button>`;
            }
            const error = model.error
              ? `<div class="model-error">${escapeHtml(model.error)}</div>`
              : '';
            return `<div class="model-card">
              <div class="model-head">
                <span class="model-name">${escapeHtml(model.name)}</span>

              </div>
              <div class="model-desc">${escapeHtml(model.description)}</div>
              <div class="model-meta">
                <span>${escapeHtml(model.languages)}</span>
                <span>${model.size_mb} МБ</span>
                <span>точность ${speechBars(model.accuracy)}</span>
                <span>скорость ${speechBars(model.speed)}</span>

        clearTimeout(speechTimer);

          const data = await response.json();
          renderSpeechModels(data.models || []);
          if ((data.models || []).some((model) => model.downloading)) {
            speechTimer = setTimeout(loadSpeechModels, 1000);

          const box = document.getElementById('speech-models');
          if (box) box.textContent = `Не удалось получить каталог: ${error.message}`;
        }

          <div class="brain-actions">
            <button class="mini-btn" data-brain-connect>Подключить OpenRouter</button>
            ${cloud.configured && active !== 'cloud' ? '<button class="mini-btn" data-brain-cloud>Использовать OpenRouter</button>' : ''}
          </div>`;
        box.innerHTML = `
          <div class="brain-option">
            <div class="model-head">
              <span class="model-name">Локальная Gemma 4 E2B</span>
              ${localBadge}
            </div>
            <div class="model-desc">~1.65 ГБ, офлайн и приватно. Ссылка для скачивания встроена в приложение.</div>

      async function loadBrainStatus() {
        clearTimeout(brainTimer);
        try {
          const response = await fetch('/api/v1/brain/status');
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const status = await response.json();
          renderBrain(status);
          if (brainAutoActivate && status.local?.installed && !status.local?.downloading) {
            brainAutoActivate = false;
            await activateLocalBrain();
            return;
          }
          if (status.local?.error) brainAutoActivate = false;
          if (status.local?.downloading || brainAutoActivate) {
            brainTimer = setTimeout(loadBrainStatus, 1000);
          }
        } catch (error) {
          const box = document.getElementById('brain-card');
          if (box) box.textContent = `Не удалось получить статус: ${error.message}`;
        }
      }

      async function downloadLocalBrain() {
        try {
          const response = await fetch('/api/v1/brain/local/download', { method: 'POST' });
          if (!response.ok) throw new Error((await response.text()).slice(0, 160));
          brainAutoActivate = true;
          await loadBrainStatus();

      async function connectCloudBrain() {
        const input = document.getElementById('brain-key');
        const status = document.getElementById('brain-status');
        const credential = input ? input.value.trim() : '';
        if (!credential) {
          if (status) status.textContent = 'Вставьте API-ключ OpenRouter.';
          return;
        }
        try {
          const response = await fetch('/api/v1/brain/cloud', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential }),
          });
          if (!response.ok) throw new Error((await response.text()).slice(0, 160));
          if (input) input.value = '';
          await loadBrainStatus();
        } catch (error) {
          if (status) status.textContent = `Ошибка: ${error.message}`;
        }
      }

          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          renderTelegram(await response.json());
        } catch (error) {
          const box = document.getElementById('telegram-card');
          if (box) box.textContent = `Не удалось получить Telegram: ${error.message}`;
        }
      }

      async function detectTelegram() {
        const status = document.getElementById('tg-status');
        const credential = document.getElementById('tg-token').value.trim();
        if (!credential) {
          if (status) status.textContent = 'Вставьте токен бота.';
          return;
        }
        if (status) status.textContent = 'Смотрю сообщения боту…';
        try {
          const response = await fetch('/api/v1/telegram/detect', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential }),
          });
          if (!response.ok) throw new Error((await response.text()).slice(0, 200));
          const data = await response.json();
          document.getElementById('tg-owner').value = data.chat_id;
          if (status) status.textContent = 'chat_id найден. Нажмите «Проверить и сохранить».';
        } catch (error) {
          if (status) status.textContent = `Ошибка: ${error.message}`;
        }
      }

      async function saveTelegram() {
        const status = document.getElementById('tg-status');
        const credential = document.getElementById('tg-token').value.trim();
        const owner = document.getElementById('tg-owner').value.trim();
        if (!credential) {
          if (status) status.textContent = 'Вставьте токен бота.';
          return;
        }
        if (status) status.textContent = 'Проверяю токен…';
        try {
          const response = await fetch('/api/v1/telegram', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ credential, owner_chat_id: owner || null }),
          });
          if (!response.ok) throw new Error((await response.text()).slice(0, 200));
          await loadTelegramStatus();
          const fresh = document.getElementById('tg-status');
          if (fresh) fresh.textContent = 'Сохранено. Запустите Tensa (Telegram bot).';
        } catch (error) {
          if (status) status.textContent = `Ошибка: ${error.message}`;
        }
      }

      async function renderSettings() {
        title.textContent = 'Настройки';
        composer.style.display = 'none';
        content.innerHTML = '<div class="bubble">Загрузка…</div>';
        try {
          const [version, speech, brain, emailConfig, telegram] = await Promise.all([
            fetch('/api/v1/version').then((r) => r.text()),
            fetch('/api/v1/models/speech').then((r) => r.json()),
            fetch('/api/v1/brain/status').then((r) => r.json()).catch(() => ({})),
            fetch('/api/v1/email/config').then((r) => r.json()).catch(() => ({ accounts: [] })),
            fetch('/api/v1/telegram/status').then((r) => r.json()).catch(() => ({})),
          ]);
          let mics = await audioInputs();
          let permitted = mics.some((device) => device.label);
          if (!permitted) {
            permitted = await ensureMicPermission();
            mics = await audioInputs();
          }
          const saved = localStorage.getItem(MIC_KEY) || '';
          const active = await activeMicDeviceId();
          const preferred = saved || active;
          const options = ['<option value="">Системный по умолчанию (Windows)</option>'];
          for (const device of mics) {
            if (!device.deviceId || device.deviceId === 'default') continue;
            const label = (device.label || `Микрофон ${options.length}`).replace(/</g, '&lt;');
            options.push(`<option value="${device.deviceId}">${label}</option>`);
          }
          content.innerHTML = `
            <div class="version-line">Версия ${escapeHtml(version.trim().replace(/^"|"$/g, ""))}</div>
            <div class="bubble mic-card">
              <div class="card-title">Микрофон</div>
              <select id="mic-select" class="mic-select">${options.join('')}</select>
              <div class="mic-status" id="mic-status">${permitted ? 'Системный микрофон Windows по умолчанию.' : 'Нет доступа к микрофону — разрешите его в Windows.'}</div>
              <div class="mic-actions">
                <button id="mic-test" class="mini-btn">Проверить 3 секунды</button>
                <button id="mic-auto" class="mini-btn">Автовыбор</button>
              </div>
            </div>
            <div class="bubble models-card">
              <div class="card-title">Модель ассистента</div>
              <div class="model-desc">Локальная Gemma 4 E2B (офлайн) или OpenRouter Gemma 4 26B (по API-ключу).</div>
              <div id="brain-card">Загрузка…</div>
            </div>
            <div class="bubble models-card">
              <div class="card-title">Почта</div>
              <div class="model-desc">SMTP-аккаунт для отправки писем. Пароль хранится только в secrets.toml.</div>
              <div id="email-card">Загрузка…</div>
            </div>
            <div class="bubble models-card">
              <div class="card-title">Telegram</div>
              <div class="model-desc">Бот-секретарь: уведомления и одобрения в Telegram.</div>
              <div id="telegram-card">Загрузка…</div>
            </div>
            <div class="bubble models-card">
              <div class="card-title">Модели распознавания речи</div>
              <div class="model-desc">До 800 МБ. Скачайте модель и выберите её — активная используется для распознавания.</div>
              <div id="speech-models">Загрузка…</div>
            </div>
            <div class="bubble"><button id="settings-quit" class="mini-btn no">Выход</button></div>`;
          const select = document.getElementById('mic-select');
          select.value = preferred;
          if (select.selectedIndex < 0) select.value = '';
          if (!saved) {
            const current = select.options[select.selectedIndex];
            document.getElementById('mic-status').textContent =
              `Сейчас: ${current ? current.text : 'системный микрофон'}.`;
          }
          select.onchange = () => {
            if (select.value) localStorage.setItem(MIC_KEY, select.value);
            else localStorage.removeItem(MIC_KEY);
            document.getElementById('mic-status').textContent =
              `Сохранено: ${select.options[select.selectedIndex].text}`;
          };
          document.getElementById('mic-test').onclick = testMicrophone;
          document.getElementById('mic-auto').onclick = autoPickMicrophone;
          document.getElementById('settings-quit').onclick = () => sendIpc('quit');
          renderBrain(brain || {});
          renderEmail(emailConfig || { accounts: [] });
          renderTelegram(telegram || {});
          renderSpeechModels(speech.models || []);
          if ((speech.models || []).some((model) => model.downloading)) {
            speechTimer = setTimeout(loadSpeechModels, 1000);
          }
        } catch (error) {
          content.innerHTML = `<div class="bubble error">${error.message}</div>`;
        }
      }

      function render() {
        if (view === 'approvals') return renderApprovals();
        if (view === 'settings') return renderSettings();
        return renderChat();
      }

      function lastFileContext() {
        for (let index = messages.length - 1; index >= 0; index -= 1) {
          const message = messages[index];
          if (message.role === 'assistant' && message.files && message.files.length) {
            return message.files
              .filter((file) => file && file.path)
              .map((file) => ({ path: file.path, name: file.name || file.path.split(/[\\/]/).pop() }));
          }
          if (message.role === 'assistant') {
            const paths = extractFilePaths(message.text || '');
            if (paths.length) {
              return paths.map((path) => ({ path, name: path.split(/[\\/]/).pop() }));
            }
          }
        }
        return [];
      }

      async function send(options = {}) {
        const text = input.value.trim();
        if (!text) return;
        input.value = '';
        messages.push({ role: 'user', text });
        if (!options.expandOnReply) renderChat();
        try {
          const response = await fetch('/api/v1/query', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ text, context_files: lastFileContext() }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const reply = await response.json();
          const files = (reply.action_payload && reply.action_payload.files) || [];
          const localAction = ['email', 'calendar', 'calendar_conflict'].includes(reply.model_used);
          messages.push({
            role: 'assistant',
            text: reply.text,
            files,
            meta: reply.model_used && !localAction ? `${reply.model_used}${reply.degraded ? ' · локальная' : ''}` : '',
          });
        } catch (error) {
          messages.push({ role: 'error', text: `Ошибка: ${error.message}` });
        }
        if (options.expandOnReply) {
          view = 'chat';
          setExpanded(true);
        }
        renderChat();
      }

      async function openFile(file) {
        try {
          const response = await fetch('/api/v1/files/open', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ path: file.path }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
        } catch (error) {
          messages.push({ role: 'error', text: `Не открылось: ${error.message}` });
          renderChat();
        }
      }

      async function decide(id, kind) {
        await fetch(`/api/v1/approvals/${id}/${kind}`, { method: 'POST' });
        renderApprovals();
        refreshBadge();
      }

      async function refreshBadge() {
        try {
          const response = await fetch('/api/v1/approvals');
          const actions = await response.json();
          const pending = actions.filter((a) => a.status === 'pending').length;
          badge.hidden = pending === 0;
          badge.textContent = String(pending);
        } catch {
          badge.hidden = true;
        }
      }

      // Перетаскивание всего дока (пилюля и лампочка) — Pointer Events.
      // Захват включается только после порога 4px, поэтому клики по кнопкам целы.
      const dock = document.getElementById('dock');
      let drag = null;
      let suppressClick = false;

      dock.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        if (event.target instanceof Element && event.target.closest('#mic')) return;
        drag = {
          id: event.pointerId,
          startX: event.screenX,
          startY: event.screenY,
          lastX: event.screenX,
          lastY: event.screenY,
          moved: false,
        };
      });

      window.addEventListener('pointermove', (event) => {
        if (!drag || event.pointerId !== drag.id) return;
        const dx = event.screenX - drag.startX;
        const dy = event.screenY - drag.startY;
        if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) {
          return;
        }
        if (!drag.moved) {
          drag.moved = true;
          try { dock.setPointerCapture(event.pointerId); } catch (error) { /* старый движок */ }
        }
        const stepX = event.screenX - drag.lastX;
        const stepY = event.screenY - drag.lastY;
        drag.lastX = event.screenX;
        drag.lastY = event.screenY;
        if (stepX || stepY) {
          sendIpc(`move ${stepX} ${stepY}`);
        }
      });

      const endDrag = (event) => {
        if (!drag || event.pointerId !== drag.id) return;
        if (drag.moved) {
          suppressClick = true;
          setTimeout(() => { suppressClick = false; }, 60);
        }
        drag = null;
      };
      window.addEventListener('pointerup', endDrag);
      window.addEventListener('pointercancel', endDrag);

      document.addEventListener('click', (event) => {
        if (suppressClick) {
          event.stopPropagation();
          event.preventDefault();
        }
      }, true);

      // Перетаскивание развёрнутой панели за шапку (кнопки и поля не трогаем).
      const panelSurface = document.getElementById('panel');
      let panelDrag = null;

      panelSurface.addEventListener('pointerdown', (event) => {
        if (event.button !== 0) return;
        const target = event.target;
        if (target instanceof Element) {
          if (target.closest('.content, button, input, select, textarea, a, summary, label')) return;
        }
        panelDrag = {
          id: event.pointerId,
          startX: event.screenX,
          startY: event.screenY,
          lastX: event.screenX,
          lastY: event.screenY,
          moved: false,
        };
      });

      window.addEventListener('pointermove', (event) => {
        if (!panelDrag || event.pointerId !== panelDrag.id) return;
        const dx = event.screenX - panelDrag.startX;
        const dy = event.screenY - panelDrag.startY;
        if (!panelDrag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
        if (!panelDrag.moved) {
          panelDrag.moved = true;
          try { panelSurface.setPointerCapture(event.pointerId); } catch (error) { /* старый движок */ }
        }
        const stepX = event.screenX - panelDrag.lastX;
        const stepY = event.screenY - panelDrag.lastY;
        panelDrag.lastX = event.screenX;
        panelDrag.lastY = event.screenY;
        if (stepX || stepY) sendIpc(`move ${stepX} ${stepY}`);
      });

      const endPanelDrag = (event) => {
        if (!panelDrag || event.pointerId !== panelDrag.id) return;
        panelDrag = null;
      };
      window.addEventListener('pointerup', endPanelDrag);
      window.addEventListener('pointercancel', endPanelDrag);

      // Голосовой ввод: запись WAV 16 кГц и локальный whisper на сервере.
      const micButton = document.getElementById('mic');
      const composerMic = document.getElementById('composer-mic');
      let recorder = null;
      let recordingSource = 'composer';

      function setMicRecording(on) {
        micButton.classList.toggle('recording', on);
        composerMic.classList.toggle('recording', on);
      }

      function mergeChunks(chunks) {
        const total = chunks.reduce((sum, chunk) => sum + chunk.length, 0);
        const merged = new Float32Array(total);
        let offset = 0;
        for (const chunk of chunks) {
          merged.set(chunk, offset);
          offset += chunk.length;
        }
        return merged;
      }

      function downsample(samples, from, to) {
        if (from === to) return samples;
        const ratio = to / from;
        const length = Math.floor(samples.length * ratio);
        const out = new Float32Array(length);
        for (let index = 0; index < length; index += 1) {
          const position = index / ratio;
          const base = Math.floor(position);
          const frac = position - base;
          const a = samples[base] ?? 0;
          const b = samples[base + 1] ?? a;
          out[index] = a + (b - a) * frac;
        }
        return out;
      }

      function encodeWav(samples, rate) {
        const buffer = new ArrayBuffer(44 + samples.length * 2);
        const view = new DataView(buffer);
        const write = (offset, text) => {
          for (let index = 0; index < text.length; index += 1) view.setUint8(offset + index, text.charCodeAt(index));
        };
        write(0, 'RIFF');
        view.setUint32(4, 36 + samples.length * 2, true);
        write(8, 'WAVE');
        write(12, 'fmt ');
        view.setUint32(16, 16, true);
        view.setUint16(20, 1, true);
        view.setUint16(22, 1, true);
        view.setUint32(24, rate, true);
        view.setUint32(28, rate * 2, true);
        view.setUint16(32, 2, true);
        view.setUint16(34, 16, true);
        write(36, 'data');
        view.setUint32(40, samples.length * 2, true);
        let offset = 44;
        for (const sample of samples) {
          const clamped = Math.max(-1, Math.min(1, sample));
          view.setInt16(offset, clamped < 0 ? clamped * 0x8000 : clamped * 0x7fff, true);
          offset += 2;
        }
        return new Blob([buffer], { type: 'audio/wav' });
      }

      let voiceHeld = false;

      async function startVoiceRecording(hold = false, origin = 'composer') {
        if (recorder) return;
        recordingSource = origin;
        if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
          messages.push({ role: 'error', text: 'Микрофон недоступен в этом движке.' });
          view = 'chat';
          setExpanded(true);
          renderChat();
          return;
        }
        try {
          if (origin !== 'pill') {
            view = 'chat';
            setExpanded(true);
          }
          const deviceId = selectedMicId();
          let stream;
          try {
            stream = await navigator.mediaDevices.getUserMedia({ audio: micConstraints(deviceId) });
          } catch (error) {
            if (!localStorage.getItem(MIC_KEY)) throw error;
            localStorage.removeItem(MIC_KEY);
            stream = await navigator.mediaDevices.getUserMedia({ audio: micConstraints() });
          }
          if (hold && !voiceHeld) {
            stream.getTracks().forEach((track) => track.stop());
            return;
          }
          const context = new AudioContext();
          await context.resume();
          const source = context.createMediaStreamSource(stream);
          const gain = context.createGain();
          gain.gain.value = 1.5;
          const processor = context.createScriptProcessor(4096, 1, 1);
          const chunks = [];
          processor.onaudioprocess = (event) => chunks.push(new Float32Array(event.inputBuffer.getChannelData(0)));
          source.connect(gain);
          gain.connect(processor);
          processor.connect(context.destination);
          recorder = { context, stream, source, gain, processor, chunks, rate: context.sampleRate };
          setMicRecording(true);
          input.placeholder = 'Говорите… отпустите — отправлю';
        } catch (error) {
          recorder = null;
          setMicRecording(false);
          messages.push({ role: 'error', text: `Микрофон: ${error.message ?? error}` });
          renderChat();
        }
      }

      async function toggleVoice() {
        if (suppressClick) return;
        if (recorder) {
          stopRecording();
          return;
        }
        await startVoiceRecording(false);
      }

      function stopRecording() {
        const current = recorder;
        if (!current) return;
        const source = recordingSource;
        recordingSource = 'composer';
        recorder = null;
        setMicRecording(false);
        current.processor.disconnect();
        current.gain.disconnect();
        current.source.disconnect();
        current.stream.getTracks().forEach((track) => track.stop());
        const samples = downsample(mergeChunks(current.chunks), current.rate, 16000);
        current.context.close();
        let peak = 0;
        for (let index = 0; index < samples.length; index += 1) {
          peak = Math.max(peak, Math.abs(samples[index]));
        }
        if (peak > 0.0005) {
          const scale = Math.min(8, 0.9 / peak);
          for (let index = 0; index < samples.length; index += 1) {
            samples[index] = Math.max(-1, Math.min(1, samples[index] * scale));
          }
        }
        input.placeholder = 'Распознаю…';
        if (samples.length < 800) {
          input.placeholder = 'Спросите Tensa…';
          messages.push({ role: 'error', text: 'Слишком короткая запись — держите микрофон, пока говорите.' });
          if (source === 'pill') setExpanded(true);
          renderChat();
          return;
        }
        fetch('/api/v1/voice/transcribe', {
          method: 'POST',
          headers: { 'Content-Type': 'audio/wav' },
          body: encodeWav(samples, 16000),
        })
          .then(async (response) => {
            if (!response.ok) {
              throw new Error((await response.text()).slice(0, 200) || `HTTP ${response.status}`);
            }
            return response.json();
          })
          .then((data) => {
            input.placeholder = 'Спросите Tensa…';
            if (data.text) {
              input.value = `${input.value ? `${input.value} ` : ''}${data.text}`.trim();
              send({ expandOnReply: source === 'pill' });
            }
          })
          .catch((error) => {
            input.placeholder = 'Спросите Tensa…';
            messages.push({ role: 'error', text: `Голос: ${humanVoiceError(error.message)}` });
            if (source === 'pill') setExpanded(true);
            renderChat();
          });
      }

      micButton.addEventListener('pointerdown', async (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        voiceHeld = true;
        try {
          micButton.setPointerCapture(event.pointerId);
        } catch (error) {
          /* старый движок */
        }
        await startVoiceRecording(true, 'pill');
      });
      const endPillVoice = (event) => {
        if (!voiceHeld) return;
        voiceHeld = false;
        if (recorder) stopRecording();
      };
      micButton.addEventListener('pointerup', endPillVoice);
      micButton.addEventListener('pointercancel', endPillVoice);
      composerMic.addEventListener('pointerdown', async (event) => {
        if (event.button !== 0) return;
        event.preventDefault();
        voiceHeld = true;
        try {
          composerMic.setPointerCapture(event.pointerId);
        } catch (error) {
          /* старый движок */
        }
        await startVoiceRecording(true, 'composer');
      });
      const endComposerVoice = (event) => {
        if (!voiceHeld) return;
        voiceHeld = false;
        if (recorder) stopRecording();
      };
      composerMic.addEventListener('pointerup', endComposerVoice);
      composerMic.addEventListener('pointercancel', endComposerVoice);
      document.getElementById('letter').onclick = () => { if (suppressClick) return; view = 'chat'; setExpanded(true); };
      document.getElementById('dots').onclick = (event) => {
        if (suppressClick) return;
        event.stopPropagation();
        menu.classList.remove('open');
        view = 'settings';
        setExpanded(true);
        render();
      };
      document.getElementById('bulb').onclick = () => { if (suppressClick) return; view = 'approvals'; setExpanded(true); render(); };
      document.getElementById('back').onclick = () => setExpanded(false);
      document.getElementById('gear').onclick = () => { view = 'settings'; render(); };
      document.getElementById('collapse').onclick = () => { menu.classList.remove('open'); setExpanded(false); };
      document.getElementById('quit').onclick = () => { menu.classList.remove('open'); sendIpc('quit'); };
      document.getElementById('send').onclick = send;
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') { event.preventDefault(); send(); }
        if (event.key === 'Escape') setExpanded(false);
      });

      menu.addEventListener('click', (event) => {
        const target = event.target;
        if (!(target instanceof HTMLElement)) return;
        const next = target.dataset.view;
        if (next) {
          view = next;
          menu.classList.remove('open');
          setExpanded(true);
          render();
        }
      });

      document.addEventListener('mousedown', (event) => {
        if (!menu.contains(event.target) && !event.target.closest('#dots')) {
          menu.classList.remove('open');
        }
      });

      // Предпросмотр развёрнутого состояния: /widget?expanded=1
      const previewExpanded =
        new URLSearchParams(location.search).get('expanded') === '1' ||
        location.hash === '#expanded';
      if (previewExpanded) {
        expanded = true;
        stage.classList.add('expanded');
        render();
      }

      async function openFirstRunSetup() {
        try {
          const [brainResponse, speechResponse] = await Promise.all([
            fetch('/api/v1/brain/status'),
            fetch('/api/v1/models/speech'),
          ]);
          if (!brainResponse.ok || !speechResponse.ok) return;
          const status = await brainResponse.json();
          const speech = await speechResponse.json();
          const hasSpeech = (speech.models || []).some((model) => model.installed);
          if ((!status.local?.installed && !status.cloud?.configured) || !hasSpeech) {
            view = 'settings';
            setExpanded(true);
            render();
          }
        } catch (error) {
          /* старый сервер */
        }
      }

      openFirstRunSetup();
      refreshBadge();
      setInterval(refreshBadge, 15000);
    </script>
  </body>
</html>
