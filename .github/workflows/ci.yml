name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Форматирование
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Форматирование (cargo fmt)
        run: cargo fmt --all --check

  clippy:
    name: Clippy
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      - name: libclang, cmake, GTK/WebKit (whisper-хелпер + Tauri)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Линтер (cargo clippy, без предупреждений)
        run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: Тесты (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      - name: libclang, cmake, GTK/WebKit (только Ubuntu — whisper + Tauri)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Тесты (cargo test --workspace)
        run: cargo test --workspace

  coverage:
    name: Покрытие (llvm-cov)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      - name: libclang, cmake, protoc, GTK/WebKit (Tauri + lance/fastembed)
        run: sudo apt-get update && sudo apt-get install -y libclang-dev cmake protobuf-compiler libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Установка cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov

      # Отклонение от плана (--all-features): native-фича llama-sys требует
      # vendored llama.cpp (вне git, TASK-ENV-001) — в CI не собирается.
      # Вместо этого включаются lance/fastembed; native покрывается ручным
      # прогоном (TASK-ENV-001).
      - name: Покрытие (порог 60% строк)
        run: cargo llvm-cov --workspace --exclude tensa-whisper --features tensa-memory/lance,tensa-memory/fastembed --fail-under-lines 60 --lcov --output-path lcov.info

      - name: Артефакт lcov.info
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: lcov.info

  audit:
    name: Аудит зависимостей (информационный)
    runs-on: ubuntu-24.04
    # Сообщено Архитектору: 19 RUSTSEC-предупреждений — все в транзитивных
    # зависимостях (proc-macro-error unmaintained и пр.); обновление крейтов
    # — отдельная задача. До неё джоба не блокирует merge.
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Установка cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: cargo audit
        run: cargo audit

  memory-vector:
    name: tensa-memory (Lance + fastembed)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      # Build-скрипту lance-encoding нужен protoc (ubuntu-раннер без него).
      - name: Установка protoc (для build-скриптов lance)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Компиляционная фиксация API lance 13.0 / fastembed 7.1
      # (ТЗ tensa-memory: tests/api_surface.rs).
      - name: Тесты памяти с векторными фичами
        run: cargo test -p tensa-memory --features lance,fastembed

  msrv:
    name: MSRV (workspace rust-version)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Версия берётся из Cargo.toml (workspace.package.rust-version) —
      # джоба не расходится с декларацией.
      - name: Определить rust-version из Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Установка Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      - name: GTK/WebKit (Tauri в workspace)
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Проверка сборки на MSRV (cargo check)
        run: cargo check --workspace --all-targets

  android:
    name: Android (aarch64, библиотеки ядра)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      - name: NDK r26b
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26b
          add-to-path: false

      - name: NDK clang в PATH (cc-rs / ring)
        run: |
          echo "ANDROID_NDK_HOME=${{ steps.ndk.outputs.ndk-path }}" >> "$GITHUB_ENV"
          echo "${{ steps.ndk.outputs.ndk-path }}/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Сборка библиотек ядра под Android
        run: cargo build --release --target aarch64-linux-android --lib -p tensa-core -p tensa-approval -p tensa-memory -p tensa-sync -p tensa-nodes -p tensa-router -p tensa-llm -p tensa-tools

  ios:
    name: iOS (aarch64, библиотеки ядра)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      # sysinfo не собирается под ios-таргет (mach API вне libc) — без tensa-perf.
      - name: Сборка библиотек ядра под iOS
        run: cargo build --release --target aarch64-apple-ios --lib -p tensa-core -p tensa-approval -p tensa-memory -p tensa-sync -p tensa-nodes
