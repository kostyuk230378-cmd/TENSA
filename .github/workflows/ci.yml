name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: fmt + clippy + tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      - name: Форматирование (cargo fmt)
        run: cargo fmt --all --check

      - name: Линтер (cargo clippy, без предупреждений)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Тесты (cargo test --workspace)
        run: cargo test --workspace

  memory-vector:
    name: tensa-memory (Lance + fastembed)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      # Build-скрипту lance-encoding нужен protoc (ubuntu-раннер без него).
      - name: Установка protoc (для build-скриптов lance)
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      # Компиляционная фиксация API lance 13.0 / fastembed 7.1
      # (ТЗ tensa-memory: tests/api_surface.rs).
      - name: Тесты памяти с векторными фичами
        run: cargo test -p tensa-memory --features lance,fastembed

  msrv:
    name: MSRV (workspace rust-version)
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Версия берётся из Cargo.toml (workspace.package.rust-version) —
      # джоба не расходится с декларацией.
      - name: Определить rust-version из Cargo.toml
        id: msrv
        run: |
          version=$(grep -m1 '^rust-version' Cargo.toml | cut -d'"' -f2)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Установка Rust ${{ steps.msrv.outputs.version }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      - name: Проверка сборки на MSRV (cargo check)
        run: cargo check --workspace --all-targets
