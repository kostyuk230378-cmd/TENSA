name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            artifact: tensa-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact: tensa-windows-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: tensa-macos-aarch64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Установка Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Кэш зависимостей
        uses: Swatinem/rust-cache@v2

      - name: GTK/WebKit (Linux — Tauri и система)
        if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev

      - name: Сборка release-бинарей
        run: cargo build --release --target ${{ matrix.target }} -p tensa-server -p tensa-cli

      - name: Сборка артефактов (архив бинарей)
        shell: bash
        run: |
          mkdir -p "dist/${{ matrix.artifact }}"
          bin_dir="target/${{ matrix.target }}/release"
          if [ -f "$bin_dir/tensa-server.exe" ]; then
            cp "$bin_dir/tensa-server.exe" "$bin_dir/tensa-cli.exe" "dist/${{ matrix.artifact }}/"
          else
            cp "$bin_dir/tensa-server" "$bin_dir/tensa-cli" "dist/${{ matrix.artifact }}/"
          fi
          cp README.md LICENSE-MIT LICENSE-APACHE "dist/${{ matrix.artifact }}/" || true

      - name: Upload артефактов
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}/*

  # Windows Setup (NSIS) и Android APK собираются штатными скриптами
  # на машине владельца (apps/desktop-lite/build_installer.ps1,
  # apps/android-lite/build_apk.ps1) и публикуются вручную — см. README.
